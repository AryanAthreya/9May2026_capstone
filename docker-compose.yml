version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/expenses.db
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=expense_tracker
    depends_on:
      - mongodb
    volumes:
      - ./data:/app/data

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
